name: Artifact CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            host: Windows
          - os: ubuntu-latest
            host: Linux
          - os: macos-latest
            host: Darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v3
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset tests-debug
      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.os }}
          path: |
            build/${{ matrix.host }}/editor-debug/artifact_editor*
            build/${{ matrix.host }}/editor-debug/tests/artifact_tests*
